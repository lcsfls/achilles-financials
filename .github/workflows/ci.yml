# Every push and pull request: types, tests, production build and the Docker
# image — the same image the in-app updater builds on a user's server.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types and templates
        run: npm run check
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Server starts and answers
        run: |
          mkdir -p /tmp/achilles-data
          DATA_DIR=/tmp/achilles-data PORT=3999 node server.js &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3999/login && break
            sleep 1
          done
          # First run without setup redirects to the wizard; the API must answer.
          curl -sf http://127.0.0.1:3999/api/settings > /dev/null
          curl -sf -o /dev/null http://127.0.0.1:3999/setup

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: achilles-financials:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and answers
        run: |
          docker run -d --name achilles -p 3998:3000 achilles-financials:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3998/login && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3998/api/settings > /dev/null
          docker logs achilles
